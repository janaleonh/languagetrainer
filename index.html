<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Bieno</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
:root{
  --bg:#f4f5f2;
  --card:#ffffff;
  --text:#2f3a2f;
  --muted:#7a847a;
  --accent:#6b7f5b;
}
body{
  margin:0;
  background:var(--bg);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif;
}
.wrapper{
  max-width:1100px;
  margin:48px auto;
  padding:0 20px;
  text-align:center;
}
h1{
  margin-bottom:12px;
  font-size:32px;
  color:var(--text);
}
p.sub{
  margin-bottom:36px;
  color:var(--muted);
  font-size:16px;
}
.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:28px;
}
@media(max-width:800px){
  .grid{ grid-template-columns:1fr; }
}
.card{
  background:var(--card);
  padding:32px;
  border-radius:22px;
  box-shadow:0 18px 36px rgba(0,0,0,.08);
}
.card h2{
  margin:0 0 10px 0;
  color:var(--text);
}
.card p{
  margin:0 0 18px 0;
  color:var(--muted);
}
.card a{
  display:inline-block;
  padding:14px 22px;
  border-radius:14px;
  background:var(--accent);
  color:white;
  text-decoration:none;
  font-weight:500;
}
</style>
</head>
<body>
<div class="wrapper">
  <h1>Bieno</h1>
  <p class="sub">Üben statt pauken. Eine ruhige Plattform für Sprachen.</p>

  <div class="grid">
    <div class="card">
      <h2>Vokabeln</h2>
      <p>Wortschatz in thematischen Gruppen trainieren.</p>
      <a href="gruppen.html">Zu den Gruppen</a>
    </div>
    <div class="card">
      <h2>Subjuntivo</h2>
      <p>Gezielte Grammatikübungen zum spanischen Subjuntivo.</p>
      <a href="subjuntivo.html">Zur Übung</a>
    </div>
  </div>
</div>
</body>
</html>
