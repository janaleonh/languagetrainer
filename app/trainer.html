<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Spanisch Trainer</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
:root{--ui-scale:1;}

:root {
  --bg:#f4f5f2; --card:#ffffff;
  --text-main:#2f3a2f; --text-muted:#7a847a;
  --box-syn:#eef3ec; --box-gram:#f1f3ee; --box-trans:#faf7f1;
  --accent:#6b7f5b;
}
body {
  margin:0; background:var(--bg);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif;
  display:flex; justify-content:center; align-items:center; height:100vh;
}
.container { width: calc(440px * var(--ui-scale)); }
.menu {
  display:flex; justify-content:space-between; align-items:center;
  margin-bottom: calc(12px * var(--ui-scale));
}
.menu button {
  background:none; border:none; color:var(--accent);
  font-size: calc(14px * var(--ui-scale)); cursor:pointer;
}
.menu .title { font-size: calc(14px * var(--ui-scale)); color:var(--text-muted); }

.card {
  background:var(--card);
  width:100%;
  height: calc(620px * var(--ui-scale));              /* HARD FIXED HEIGHT */
  padding: calc(34px * var(--ui-scale));
  border-radius: calc(26px * var(--ui-scale));
  box-shadow:0 24px 55px rgba(0,0,0,.10);
  display:flex;
  flex-direction:column;
  justify-content:space-between;
  text-align:center;
}

.content {
  flex:1;
  display:flex;
  flex-direction:column;
  justify-content:flex-start;
  min-height: calc(420px * var(--ui-scale));          /* RESERVE SPACE */
}

.word {
  font-size: calc(38px * var(--ui-scale));
  font-weight:600;
  color:var(--text-main);
  margin-bottom: calc(22px * var(--ui-scale));
}

.box {
  border-radius: calc(16px * var(--ui-scale));
  padding:14px 16px;
  font-size: calc(15px * var(--ui-scale));
  line-height:1.55;
  margin-bottom: calc(14px * var(--ui-scale));
  display:none;
}

.synonyms { background:var(--box-syn); color:#445a44; }
.forms    { background:var(--box-gram); color:#5a5f46; }
.translation {
  background:var(--box-trans);
  color:#6a4f2c;
  font-size: calc(20px * var(--ui-scale));
  font-weight:600;
}

.actions {
  margin-top:12px;
}

.mainBtn {
  width:100%;
  padding: calc(16px * var(--ui-scale));
  font-size: calc(17px * var(--ui-scale));
  font-weight:500;
  border:none;
  border-radius: calc(16px * var(--ui-scale));
  background:var(--accent);
  color:white;
}

.footer {
  font-size: calc(13px * var(--ui-scale));
  color:var(--text-muted);
  margin-top:12px;
}
</style>
</head>
<body>

<div class="container">
  <div class="menu">
    <button onclick="location.href='index.html'">← Gruppen</button>
    <div class="title" id="groupTitle"></div>
    <div></div>
  </div>

  <div class="card">
    <div class="content">
      <div class="word" id="word"></div>
      <div class="box synonyms" id="syn"></div>
      <div class="box forms" id="forms"></div>
      <div class="box translation" id="trans"></div>
    </div>
    <div class="actions">
      <button class="mainBtn" id="btn" onclick="clickBtn()">Aufdecken</button>
      <div class="footer" id="counter"></div>
    </div>
  </div>
</div>

<script src="vokabeln.js"></script>
<script>

function shuffleArray(array) {
  for (let i = array.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [array[i], array[j]] = [array[j], array[i]];
  }
}

function getParam(n){return new URLSearchParams(window.location.search).get(n);}
var gi=parseInt(getParam("group"),10); if(isNaN(gi)) gi=0;
var g=vocabGroups[gi];

// 🔀 Zufällige Reihenfolge pro Gruppenstart
shuffleArray(g.words);
document.getElementById("groupTitle").textContent=g.title;

var i=0, shown=false;

function load(){
 var v=g.words[i];
 document.getElementById("word").textContent=v.es;
 document.getElementById("syn").textContent=v.synonyms.join(" · ");
 document.getElementById("forms").innerHTML =
  "Gerundio: "+v.gerundio+
  "<br>Participio: "+v.participio+
  "<br>Subjuntivo: "+v.subjuntivo+
  "<br>Pretérito indef.: "+v.indefinido;
 document.getElementById("trans").textContent=v.de.join(" · ");
 document.getElementById("syn").style.display =
 document.getElementById("forms").style.display =
 document.getElementById("trans").style.display = "none";
 document.getElementById("btn").textContent="Aufdecken";
 document.getElementById("counter").textContent=(i+1)+" / "+g.words.length;
 shown=false;
}

function clickBtn(){
 if(!shown){
  document.getElementById("syn").style.display =
  document.getElementById("forms").style.display =
  document.getElementById("trans").style.display = "block";
  document.getElementById("btn").textContent="Weiter";
  shown=true;
 } else {
  i=(i+1)%g.words.length;
  load();
 }
}

load();
</script>

<script>
(function(){
  function updateUIScale(){
    const vw = window.innerWidth;
    const vh = window.innerHeight;
    const base = Math.min(vw/1200, vh/800);
    const scale = Math.max(0.9, Math.min(1.4, base));
    document.documentElement.style.setProperty('--ui-scale', scale.toFixed(3));
  }
  window.addEventListener('resize', updateUIScale);
  updateUIScale();
})();
</script>
</body>
</html>
