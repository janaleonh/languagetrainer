<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Trainer</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
:root{
  --bg:#f4f5f2;
  --card:#ffffff;
  --text:#2f3a2f;
  --muted:#7a847a;
  --accent:#6b7f5b;
}
*{ box-sizing:border-box; }
body{
  margin:0;
  background:var(--bg);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif;
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:16px;
}
.container{
  width:100%;
  max-width:520px;
}
.menu{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:12px;
  font-size:14px;
}
.menu button{
  background:none;
  border:none;
  color:var(--accent);
  font-size:14px;
}
.menu .title{ color:var(--muted); }
.card{
  background:var(--card);
  border-radius:20px;
  padding:20px;
  box-shadow:0 16px 32px rgba(0,0,0,.08);
  display:flex;
  flex-direction:column;
  gap:14px;
}
.word{
  font-size:32px;
  font-weight:600;
  text-align:center;
  color:var(--text);
}
.box{
  display:none;
  padding:14px;
  border-radius:14px;
  font-size:15px;
  line-height:1.5;
}
.synonyms{ background:#eef3ec; color:#445a44; }
.forms{ background:#f1f3ee; color:#5a5f46; }
.translation{
  background:#faf7f1;
  color:#6a4f2c;
  font-weight:600;
}
.actions{ margin-top:10px; }
button.main{
  width:100%;
  padding:16px;
  border:none;
  border-radius:14px;
  background:var(--accent);
  color:white;
  font-size:16px;
}
.footer{
  margin-top:8px;
  text-align:center;
  font-size:12px;
  color:var(--muted);
}
@media (max-width:480px){
  body{ align-items:flex-start; }
  .word{ font-size:28px; }
  .box{ font-size:14px; }
  button.main{ font-size:17px; padding:18px; }
}
@media (min-width:900px){
  .container{ max-width:600px; }
  .word{ font-size:36px; }
}
</style>
</head>
<body>
<div class="container">
  <div class="menu">
    <button onclick="location.href='index.html'">← Gruppen</button>
    <div class="title" id="groupTitle"></div>
    <div></div>
  </div>
  <div class="card" id="card">
    <div class="word" id="word"></div>
    <div class="box synonyms" id="syn"></div>
    <div class="box forms" id="forms"></div>
    <div class="box translation" id="trans"></div>
    <div class="actions">
      <button class="main" id="btn" onclick="clickBtn()">Aufdecken</button>
      <div class="footer" id="counter"></div>
    </div>
  </div>
</div>
<script src="vokabeln.js"></script>
<script>
function shuffleArray(array){
  for(let i=array.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [array[i],array[j]]=[array[j],array[i]];
  }
}
const params=new URLSearchParams(location.search);
const gi=parseInt(params.get("group"))||0;
const g=vocabGroups[gi];
shuffleArray(g.words);
document.getElementById("groupTitle").textContent=g.title;
let i=0,shown=false;
function load(){
  const v=g.words[i];
  word.textContent=v.es;
  syn.textContent=v.synonyms.join(" · ");
  forms.innerHTML="Gerundio: "+v.gerundio+"<br>Participio: "+v.participio+"<br>Subjuntivo: "+v.subjuntivo+"<br>Pretérito: "+v.indefinido;
  trans.textContent=v.de.join(" · ");
  syn.style.display=forms.style.display=trans.style.display="none";
  btn.textContent="Aufdecken";
  counter.textContent=(i+1)+" / "+g.words.length;
  shown=false;
}
function clickBtn(){
  if(!shown){
    syn.style.display=forms.style.display=trans.style.display="block";
    btn.textContent="Weiter";
    shown=true;
  }else{
    i=(i+1)%g.words.length;
    load();
  }
}
load();
</script>
</body>
</html>
